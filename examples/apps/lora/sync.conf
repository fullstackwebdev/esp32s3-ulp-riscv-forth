# The SX126x LoRa sync word, MEASURED against a stock Meshtastic node - never derived.
#
# Two registers, 0x0740 (msb) and 0x0741 (lsb). RadioLib's setSyncWord(syncWord, controlBits) writes them, and calls
# the second byte "undocumented control bits, required for compatibility purposes".
#
# Measured 2026-11-03 with tests/mesh_sync_rx_sweep.py, receiving a real packet from firmware 2.7.26 (IRQ words are the
# receiver's own verdict):
#   0x0740=0x2B 0x0741=0x24 -> 0x0056  RxDone + HeaderValid + CrcErr   (sync locks, demodulation is wrong)
#   0x0740=0x14 0x0741=0x24 -> 0x0016  RxDone + HeaderValid             (clean)
#   0x0740=any 0x0741!=0x24 -> 0x0004  PreambleDetected only            (never reaches sync)
# So the LSB must be 0x24 and the MSB must be 0x14 - the public LoRa pair, NOT the 0x2B that the firmware asks for.
sync_msb = 0x14
sync_lsb = 0x24
